<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Minutes AI</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0e0f11; --surface: #161719; --surface2: #1e2023;
  --border: #2a2d31; --text: #e4e4e7; --text2: #8b8d94;
  --accent: #ef4444; --green: #22c55e; --blue: #3b82f6; --amber: #f59e0b;
  --purple: #a855f7;
  --radius: 12px;
}

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
}

.app { max-width: 960px; margin: 0 auto; padding: 40px 24px; }

header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
header h1 span { color: var(--text2); font-weight: 400; }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text2);
  display: inline-block; margin-right: 8px; transition: all 0.3s;
}
.status-dot.recording { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s ease-in-out infinite; }
.status-dot.ready { background: var(--green); }
.status-dot.paused { background: var(--amber); box-shadow: 0 0 8px rgba(245,158,11,0.5); }
.status-dot.processing { background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: pulse 1.5s ease-in-out infinite; }
.status-dot.merging { background: var(--purple); box-shadow: 0 0 8px var(--purple); animation: pulse 1.5s ease-in-out infinite; }

@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

.recording-setup { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.mode-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
.mode-toggle button {
  padding: 8px 16px; border-radius: 0; font-size: 13px;
  background: var(--surface); color: var(--text2);
  border: none; border-right: 1px solid var(--border); transition: all 0.2s;
}
.mode-toggle button:last-child { border-right: none; }
.mode-toggle button.active { background: var(--blue); color: white; }
.mode-toggle button:hover:not(.active):not(:disabled) { background: var(--surface2); }
.mode-toggle button:disabled { opacity: 0.4; cursor: not-allowed; }

.topic-input {
  flex: 1; min-width: 200px; padding: 8px 14px; font-size: 13px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
}
.topic-input:focus { border-color: var(--blue); }
.topic-input::placeholder { color: var(--text2); }
.topic-input:disabled { opacity: 0.4; cursor: not-allowed; }

.controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }

button {
  font-family: inherit; font-size: 14px; font-weight: 500;
  border: none; border-radius: 8px; padding: 10px 20px;
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
}
.btn-record { background: var(--accent); color: white; }
.btn-record:hover { background: #dc2626; }
.btn-record:disabled { background: var(--surface2); color: var(--text2); cursor: not-allowed; }
.btn-pause { background: var(--amber); color: #1a1a1a; }
.btn-pause:hover { background: #d97706; }
.btn-pause.is-paused { background: var(--green); color: white; }
.btn-pause.is-paused:hover { background: #16a34a; }
.btn-pause:disabled { background: var(--surface2); color: var(--text2); cursor: not-allowed; }
.btn-stop { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-stop:hover { background: var(--border); }
.btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-summarize { background: var(--blue); color: white; }
.btn-summarize:hover { background: #2563eb; }
.btn-summarize:disabled { background: var(--surface2); color: var(--text2); cursor: not-allowed; }
.btn-icon { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  display: flex; flex-direction: column; position: relative;
}
.panel-header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.05em;
  display: flex; align-items: center; justify-content: space-between;
}
.panel-header .count {
  font-weight: 400; font-size: 12px;
  background: var(--surface2); padding: 2px 8px; border-radius: 10px;
}
.panel-body {
  padding: 16px 18px; flex: 1; min-height: 300px; max-height: 500px;
  overflow-y: auto; font-size: 14px; line-height: 1.8;
}
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ─── 소스 탭 (실시간 / 정밀 / 병합) ─── */
.source-tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.source-tab {
  flex: 1; padding: 8px 12px; font-size: 11px; font-weight: 600;
  text-align: center; cursor: pointer; border: none; border-radius: 0;
  background: transparent; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.04em;
  transition: all 0.2s; position: relative;
}
.source-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.source-tab.active { color: var(--text); }
.source-tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; border-radius: 1px;
}
.source-tab.tab-realtime.active::after { background: var(--accent); }
.source-tab.tab-precise.active::after { background: var(--blue); }
.source-tab.tab-merged.active::after { background: var(--green); }
.source-tab .tab-badge {
  display: inline-block; font-size: 10px; padding: 1px 5px;
  border-radius: 6px; margin-left: 4px; font-weight: 400;
}
.source-tab.tab-realtime .tab-badge { background: rgba(239,68,68,0.15); color: var(--accent); }
.source-tab.tab-precise .tab-badge { background: rgba(59,130,246,0.15); color: var(--blue); }
.source-tab.tab-merged .tab-badge { background: rgba(34,197,94,0.15); color: var(--green); }
.source-tab.disabled { opacity: 0.3; cursor: default; }

/* ─── Panel Overlay ─── */
.panel-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(14, 15, 17, 0.88);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 10;
  border-radius: var(--radius);
}
.panel-overlay.visible { display: flex; }
.panel-overlay-icon { font-size: 36px; }
.panel-overlay-title { font-size: 15px; font-weight: 600; color: var(--text); }
.panel-overlay-sub { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.5; }
.panel-overlay-status {
  font-size: 13px; color: var(--green);
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 6px;
}
.panel-overlay-status .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  animation: pulse 1.5s ease-in-out infinite;
}
.panel-overlay-status.warning { color: var(--amber); }
.panel-overlay-status.warning .dot { background: var(--amber); }

/* ─── Pipeline Progress ─── */
.pipeline-steps {
  display: flex; gap: 8px; align-items: center; margin-top: 8px;
}
.pipeline-step {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text2); transition: all 0.3s;
}
.pipeline-step .step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: all 0.3s;
  flex-shrink: 0;
}
.pipeline-step.active { color: var(--text); }
.pipeline-step.active .step-dot { background: var(--blue); box-shadow: 0 0 6px var(--blue); animation: pulse 1.5s ease-in-out infinite; }
.pipeline-step.done { color: var(--green); }
.pipeline-step.done .step-dot { background: var(--green); box-shadow: none; animation: none; }
.pipeline-step-arrow { color: var(--border); font-size: 10px; }

.transcript-line {
  padding: 4px 0; animation: fadeIn 0.3s ease;
  border-bottom: 1px solid var(--border);
}
.transcript-line:last-child { border-bottom: none; }
.transcript-time { font-size: 11px; color: var(--text2); margin-right: 8px; font-variant-numeric: tabular-nums; }
.transcript-line.realtime-source { border-left: 2px solid var(--accent); padding-left: 10px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.summary-content { white-space: pre-wrap; word-break: break-word; }
.summary-content h1, .summary-content h2, .summary-content h3 { margin-top: 16px; margin-bottom: 8px; font-weight: 600; }
.summary-content h1 { font-size: 18px; }
.summary-content h2 { font-size: 16px; }
.summary-content h3 { font-size: 14px; color: var(--text2); }
.summary-content ul, .summary-content ol { padding-left: 20px; margin: 8px 0; }
.summary-content li { margin: 4px 0; }

.summary-actions {
  display: flex; gap: 8px; padding: 12px 18px;
  border-top: 1px solid var(--border); background: var(--surface2);
}
.summary-actions button {
  font-size: 12px; padding: 6px 14px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); border-radius: 6px;
}
.summary-actions button:hover { color: var(--text); border-color: var(--text2); }
.summary-actions .copied { color: var(--green); border-color: var(--green); }

.empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; min-height: 200px;
  color: var(--text2); font-size: 14px; text-align: center;
}
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }

.timer {
  font-variant-numeric: tabular-nums; font-size: 14px; color: var(--text2);
  padding: 10px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  min-width: 80px; text-align: center;
}
.timer.active { color: var(--accent); }
.timer.paused { color: var(--amber); }
.timer.processing { color: var(--blue); }
.timer.merging { color: var(--purple); }

.loading { display: inline-flex; gap: 4px; align-items: center; }
.loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: loadPulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.15s; }
.loading-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes loadPulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

.error-banner {
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  font-size: 13px; color: #fca5a5; display: none;
}
.error-banner.visible { display: block; }

.history-section { margin-top: 32px; }
.history-toggle { text-align: center; }
.history-toggle button {
  background: transparent; color: var(--text2);
  border: 1px solid var(--border); font-size: 13px; margin: 0 auto;
}
.history-toggle button:hover { color: var(--text); border-color: var(--text2); }
.history-list { margin-top: 16px; }
.history-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
}
.history-item:hover { border-color: var(--text2); background: var(--surface2); }
.history-item-left { display: flex; flex-direction: column; gap: 2px; }
.history-item-date { font-size: 14px; font-weight: 500; }
.history-item-topic { font-size: 12px; color: var(--text2); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item-badges { display: flex; gap: 6px; font-size: 11px; align-items: center; }
.history-item-badges span { padding: 2px 8px; border-radius: 4px; background: var(--surface2); color: var(--text2); }
.history-item-badges .has { background: rgba(34,197,94,0.15); color: var(--green); }
.history-item-mode { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(59,130,246,0.15); color: var(--blue); }
.history-item-mode.personal { background: rgba(245,158,11,0.15); color: var(--amber); }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1><span class="status-dot" id="statusDot"></span>Meeting Minutes <span>AI</span></h1>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="recording-setup">
    <div class="mode-toggle">
      <button class="active" id="modeCompany" onclick="setMode('company')">🏢 회사</button>
      <button id="modePersonal" onclick="setMode('personal')">👤 개인</button>
    </div>
    <input type="text" class="topic-input" id="topicInput" placeholder="회의 주제를 입력하세요 (예: 스프린트 회고, Q2 계획)">
  </div>

  <div class="controls">
    <button class="btn-record" id="btnRecord" onclick="startRecording()">
      <span class="btn-icon" style="background:white"></span> 녹음 시작
    </button>
    <button class="btn-pause" id="btnPause" onclick="pauseRecording()" disabled>⏸ 일시정지</button>
    <button class="btn-stop" id="btnStop" onclick="stopRecording()" disabled>녹음 종료</button>
    <button class="btn-summarize" id="btnSummarize" onclick="summarize()" disabled>요약 생성</button>
  </div>

  <div class="panels">
    <div class="panel" id="transcriptPanelWrap">
      <div class="panel-header">
        트랜스크립트
        <span class="count" id="lineCount">0줄</span>
      </div>

      <!-- 소스 탭 -->
      <div class="source-tabs" id="sourceTabs" style="display:none;">
        <button class="source-tab tab-realtime active" onclick="switchTab('realtime')">
          실시간 <span class="tab-badge" id="realtimeBadge">0</span>
        </button>
        <button class="source-tab tab-precise disabled" onclick="switchTab('precise')" id="preciseTab">
          정밀 <span class="tab-badge" id="preciseBadge">0</span>
        </button>
        <button class="source-tab tab-merged disabled" onclick="switchTab('merged')" id="mergedTab">
          병합 <span class="tab-badge" id="mergedBadge">0</span>
        </button>
      </div>

      <div class="panel-body" id="transcriptPanel">
        <div class="empty"><div><div class="empty-icon">🎙️</div>녹음을 시작하면 실시간 STT로<br>텍스트가 바로 표시됩니다</div></div>
      </div>

      <!-- 녹음 중 하단 상태 (오버레이 대신) -->
      <div id="recordingStatusBar" style="display:none; padding:8px 18px; border-top:1px solid var(--border); background:var(--surface2); font-size:12px; color:var(--text2); display:none;">
        <span style="display:inline-flex;align-items:center;gap:6px;">
          <span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite;"></span>
          <span id="recordingFileSize">대기 중...</span>
        </span>
      </div>

      <!-- 변환/병합 중 오버레이 -->
      <div class="panel-overlay" id="processingOverlay">
        <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
        <div class="panel-overlay-title" id="processingTitle">처리 중</div>
        <div class="panel-overlay-sub" id="processingMsg">잠시만 기다려주세요...</div>
        <div class="pipeline-steps" id="pipelineSteps">
          <div class="pipeline-step" id="stepPrecise">
            <span class="step-dot"></span> 정밀 STT
          </div>
          <span class="pipeline-step-arrow">→</span>
          <div class="pipeline-step" id="stepMerge">
            <span class="step-dot"></span> Gemini 병합
          </div>
          <span class="pipeline-step-arrow">→</span>
          <div class="pipeline-step" id="stepDone">
            <span class="step-dot"></span> 완료
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        회의 요약
        <span class="count" id="summaryStatus">대기</span>
      </div>
      <div class="panel-body" id="summaryPanel">
        <div class="empty"><div><div class="empty-icon">📋</div>녹음 종료 후 요약 생성 버튼을<br>누르면 AI가 정리합니다</div></div>
      </div>
      <div class="summary-actions" id="summaryActions" style="display:none;">
        <button onclick="copySummary()">📋 복사</button>
        <button onclick="downloadSummary()">💾 파일 저장</button>
      </div>
    </div>
  </div>

  <div class="history-section">
    <div class="history-toggle"><button onclick="toggleHistory()">과거 회의록 보기</button></div>
    <div class="history-list" id="historyList" style="display:none;"></div>
  </div>
</div>

<script>
let ws = null, timerInterval = null, startTime = null, pausedElapsed = 0;
let lineCount = 0, isPaused = false;
let currentSummaryText = "", currentMeetingId = "", historyOpen = false, currentMode = "company";

// 3종류 텍스트 저장
let realtimeData = [];  // [{time, text}, ...]
let preciseData = [];
let mergedData = [];
let currentTab = "realtime";

function setMode(mode) {
  currentMode = mode;
  document.getElementById("modeCompany").classList.toggle("active", mode === "company");
  document.getElementById("modePersonal").classList.toggle("active", mode === "personal");
  document.getElementById("topicInput").placeholder = mode === "company"
    ? "회의 주제를 입력하세요 (예: 스프린트 회고, Q2 계획)"
    : "메모 주제를 입력하세요 (예: 독서 메모, 아이디어 정리)";
}

function connectWS() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    switch (data.type) {
      case "transcript":
        handleRealtimeTranscript(data.line);
        break;
      case "precise-transcript":
        handlePreciseTranscript(data);
        break;
      case "merged-transcript":
        handleMergedTranscript(data);
        break;
      case "summary":
        showSummary(data.content);
        break;
      case "status":
        if (data.summarizing !== undefined) {
          document.getElementById("summaryStatus").textContent = data.summarizing ? "생성 중..." : "완료";
          if (data.summarizing) {
            document.getElementById("summaryPanel").innerHTML =
              '<div class="empty"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><br>Gemini가 요약을 생성하고 있습니다...</div>';
            document.getElementById("summaryActions").style.display = "none";
          }
        }
        break;
      case "recording-status":
        updateRecordingStatus(data);
        break;
      case "recording-error":
        showError(data.message);
        break;
      case "transcribing":
        handleTranscribing(data);
        break;
      case "log":
        console.log("[server]", data.message);
        break;
    }
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}
connectWS();

// ─── 실시간 STT 결과 수신 ───
function handleRealtimeTranscript(line) {
  realtimeData.push(line);
  document.getElementById("realtimeBadge").textContent = realtimeData.length;

  // 현재 실시간 탭이면 바로 표시
  if (currentTab === "realtime") {
    appendTranscriptLine(line, "realtime");
  }

  lineCount = realtimeData.length;
  updateLineCount();
}

// ─── 정밀 STT 결과 수신 ───
function handlePreciseTranscript(data) {
  const lines = data.text.split("\n").filter(l => l.trim());
  preciseData = lines.map(text => ({ text, time: "" }));
  document.getElementById("preciseBadge").textContent = preciseData.length;

  // 정밀 탭 활성화
  document.getElementById("preciseTab").classList.remove("disabled");
}

// ─── 병합 텍스트 수신 ───
function handleMergedTranscript(data) {
  const lines = data.text.split("\n").filter(l => l.trim());
  mergedData = lines.map(text => ({ text, time: "" }));
  document.getElementById("mergedBadge").textContent = mergedData.length;

  // 병합 탭 활성화 + 자동 전환
  document.getElementById("mergedTab").classList.remove("disabled");
  switchTab("merged");

  // 라인 카운트를 병합 기준으로 업데이트
  lineCount = mergedData.length;
  updateLineCount();
}

// ─── 탭 전환 ───
function switchTab(tab) {
  // disabled 탭은 전환 불가
  if (tab === "precise" && document.getElementById("preciseTab").classList.contains("disabled")) return;
  if (tab === "merged" && document.getElementById("mergedTab").classList.contains("disabled")) return;

  currentTab = tab;

  // 탭 활성화 상태
  document.querySelectorAll(".source-tab").forEach(t => t.classList.remove("active"));
  document.querySelector(`.tab-${tab}`).classList.add("active");

  // 패널 내용 교체
  const panel = document.getElementById("transcriptPanel");
  panel.innerHTML = "";

  let dataSource;
  if (tab === "realtime") dataSource = realtimeData;
  else if (tab === "precise") dataSource = preciseData;
  else dataSource = mergedData;

  if (dataSource.length === 0) {
    panel.innerHTML = '<div class="empty"><div>데이터가 없습니다</div></div>';
    return;
  }

  for (const line of dataSource) {
    appendTranscriptLine(line, tab, false);
  }
  panel.scrollTop = panel.scrollHeight;

  // 라인 카운트 업데이트
  updateLineCount();
}

function appendTranscriptLine(line, source, scroll = true) {
  const panel = document.getElementById("transcriptPanel");
  if (panel.querySelector(".empty")) panel.innerHTML = "";

  const div = document.createElement("div");
  div.className = "transcript-line";
  if (source === "realtime") div.classList.add("realtime-source");

  const timeStr = line.time ? formatKST(line.time) : "";
  const timeHtml = timeStr ? `<span class="transcript-time">${timeStr}</span>` : "";
  div.innerHTML = `${timeHtml}${escapeHtml(line.text)}`;
  panel.appendChild(div);

  if (scroll) panel.scrollTop = panel.scrollHeight;
}

// ─── 파이프라인 진행 상태 ───
function handleTranscribing(data) {
  const overlay = document.getElementById("processingOverlay");
  const statusDot = document.getElementById("statusDot");
  const timer = document.getElementById("timer");

  switch (data.status) {
    case "start":
      // 녹음 상태바 숨기기
      document.getElementById("recordingStatusBar").style.display = "none";
      // 오버레이 표시
      overlay.classList.add("visible");
      statusDot.className = "status-dot processing";
      timer.className = "timer processing";
      document.getElementById("processingTitle").textContent = "정밀 STT 변환 중";
      document.getElementById("processingMsg").textContent = data.message || "Whisper AI가 녹음 파일을 정밀 분석하고 있습니다...";
      // 파이프라인 스텝
      setPipelineStep("precise");
      break;

    case "precise-done":
      document.getElementById("processingTitle").textContent = "정밀 STT 완료";
      setPipelineStep("precise-done");
      break;

    case "merging":
      statusDot.className = "status-dot merging";
      timer.className = "timer merging";
      document.getElementById("processingTitle").textContent = "Gemini 교차 검증 중";
      document.getElementById("processingMsg").textContent = data.message || "두 텍스트를 비교하여 최종 교정 중...";
      setPipelineStep("merge");
      break;

    case "merge-fallback":
      document.getElementById("processingMsg").textContent = data.message || "병합 실패 — 정밀 STT 사용";
      break;

    case "done":
      overlay.classList.remove("visible");
      statusDot.className = "status-dot ready";
      timer.className = "timer";
      setPipelineStep("done");
      setUIState("idle");
      break;

    case "error":
      overlay.classList.remove("visible");
      showError(`처리 실패: ${data.message}`);
      statusDot.className = "status-dot ready";
      timer.className = "timer";
      setUIState("idle");
      break;

    case "progress":
      if (data.message) {
        document.getElementById("processingMsg").textContent = data.message;
      }
      break;
  }
}

function setPipelineStep(step) {
  const precise = document.getElementById("stepPrecise");
  const merge = document.getElementById("stepMerge");
  const done = document.getElementById("stepDone");

  // 리셋
  [precise, merge, done].forEach(el => { el.className = "pipeline-step"; });

  switch (step) {
    case "precise":
      precise.classList.add("active");
      break;
    case "precise-done":
      precise.classList.add("done");
      break;
    case "merge":
      precise.classList.add("done");
      merge.classList.add("active");
      break;
    case "done":
      precise.classList.add("done");
      merge.classList.add("done");
      done.classList.add("done");
      break;
  }
}

function updateRecordingStatus(data) {
  const bar = document.getElementById("recordingStatusBar");
  const el = document.getElementById("recordingFileSize");

  if (data.growing) {
    el.textContent = `녹음 저장 중 — ${data.fileSize} MB`;
    el.parentElement.querySelector(".dot").style.background = "var(--green)";
  } else if (data.warning) {
    el.textContent = data.warning;
    el.parentElement.querySelector(".dot").style.background = "var(--amber)";
  }
}

function setUIState(state) {
  const btnRecord = document.getElementById("btnRecord");
  const btnPause = document.getElementById("btnPause");
  const btnStop = document.getElementById("btnStop");
  const btnSummarize = document.getElementById("btnSummarize");
  const statusDot = document.getElementById("statusDot");
  const timer = document.getElementById("timer");
  const topicInput = document.getElementById("topicInput");
  const modeButtons = document.querySelectorAll(".mode-toggle button");
  const statusBar = document.getElementById("recordingStatusBar");
  const sourceTabs = document.getElementById("sourceTabs");

  switch (state) {
    case "idle":
      btnRecord.disabled = false;
      btnPause.disabled = true; btnPause.classList.remove("is-paused"); btnPause.textContent = "⏸ 일시정지";
      btnStop.disabled = true;
      // 병합 또는 정밀 또는 실시간 데이터가 있으면 요약 가능
      btnSummarize.disabled = (mergedData.length + preciseData.length + realtimeData.length) === 0;
      statusDot.className = "status-dot ready";
      timer.className = "timer";
      topicInput.disabled = false;
      modeButtons.forEach(b => b.disabled = false);
      statusBar.style.display = "none";
      break;
    case "recording":
      btnRecord.disabled = true;
      btnPause.disabled = false; btnPause.classList.remove("is-paused"); btnPause.textContent = "⏸ 일시정지";
      btnStop.disabled = false;
      btnSummarize.disabled = true;
      statusDot.className = "status-dot recording";
      timer.className = "timer active";
      topicInput.disabled = true;
      modeButtons.forEach(b => b.disabled = true);
      statusBar.style.display = "block";
      sourceTabs.style.display = "flex";
      document.getElementById("recordingFileSize").textContent = "대기 중...";
      break;
    case "paused":
      btnRecord.disabled = true;
      btnPause.disabled = false; btnPause.classList.add("is-paused"); btnPause.textContent = "▶ 재개";
      btnStop.disabled = false;
      btnSummarize.disabled = true;
      statusDot.className = "status-dot paused";
      timer.className = "timer paused";
      statusBar.style.display = "none";
      break;
  }
}

async function startRecording() {
  hideError();
  try {
    const res = await fetch("/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: currentMode, topic: document.getElementById("topicInput").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    isPaused = false;
    setUIState("recording");

    // 초기화
    realtimeData = [];
    preciseData = [];
    mergedData = [];
    currentTab = "realtime";

    document.getElementById("transcriptPanel").innerHTML = "";
    document.getElementById("summaryPanel").innerHTML =
      '<div class="empty"><div><div class="empty-icon">📋</div>녹음 종료 후 요약 생성 버튼을<br>누르면 AI가 정리합니다</div></div>';
    document.getElementById("summaryStatus").textContent = "대기";
    document.getElementById("summaryActions").style.display = "none";
    currentSummaryText = "";
    currentMeetingId = data.meetingDir?.split("/").pop() || "";

    // 탭 초기화
    document.getElementById("sourceTabs").style.display = "flex";
    document.getElementById("realtimeBadge").textContent = "0";
    document.getElementById("preciseBadge").textContent = "0";
    document.getElementById("mergedBadge").textContent = "0";
    document.getElementById("preciseTab").classList.add("disabled");
    document.getElementById("mergedTab").classList.add("disabled");
    document.querySelectorAll(".source-tab").forEach(t => t.classList.remove("active"));
    document.querySelector(".tab-realtime").classList.add("active");

    lineCount = 0;
    pausedElapsed = 0;
    updateLineCount();

    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
  } catch (err) { showError(err.message); }
}

async function pauseRecording() {
  hideError();
  try {
    if (!isPaused) {
      const res = await fetch("/api/pause", { method: "POST" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      isPaused = true;
      pausedElapsed += Date.now() - startTime;
      clearInterval(timerInterval);
      setUIState("paused");
    } else {
      const res = await fetch("/api/resume", { method: "POST" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      isPaused = false;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
      setUIState("recording");
    }
  } catch (err) { showError(err.message); }
}

async function stopRecording() {
  try {
    clearInterval(timerInterval);
    document.getElementById("btnStop").disabled = true;
    document.getElementById("btnPause").disabled = true;
    document.getElementById("recordingStatusBar").style.display = "none";

    const res = await fetch("/api/stop", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    isPaused = false;
    // 이후 처리는 WebSocket 메시지로 진행
  } catch (err) { showError(err.message); }
}

async function summarize() {
  document.getElementById("btnSummarize").disabled = true;
  try {
    const res = await fetch("/api/summarize", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
  } catch (err) {
    showError(err.message);
    document.getElementById("btnSummarize").disabled = false;
  }
}

function showSummary(content) {
  currentSummaryText = content;
  document.getElementById("summaryPanel").innerHTML = `<div class="summary-content">${renderMarkdown(content)}</div>`;
  document.getElementById("summaryStatus").textContent = "완료";
  document.getElementById("summaryActions").style.display = "flex";
  document.getElementById("btnSummarize").disabled = false;
}

function renderMarkdown(text) {
  return escapeHtml(text)
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm, "<h2>$1</h2>")
    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\*\s+(.+)$/gm, "<li>$1</li>")
    .replace(/^-\s+(.+)$/gm, "<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
    .replace(/\n\n/g, "<br><br>")
    .replace(/\n/g, "<br>");
}

function copySummary() {
  navigator.clipboard.writeText(currentSummaryText).then(() => {
    const btn = document.querySelector(".summary-actions button:first-child");
    btn.textContent = "✅ 복사됨"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 복사"; btn.classList.remove("copied"); }, 2000);
  });
}

function downloadSummary() {
  if (currentMeetingId) {
    window.location.href = `/api/meetings/${currentMeetingId}/download`;
  } else {
    const blob = new Blob([currentSummaryText], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "회의록.md"; a.click();
    URL.revokeObjectURL(url);
  }
}

function toggleHistory() {
  historyOpen = !historyOpen;
  const list = document.getElementById("historyList");
  if (historyOpen) { list.style.display = "block"; loadHistory(); }
  else { list.style.display = "none"; }
}

async function loadHistory() {
  try {
    const res = await fetch("/api/meetings");
    const meetings = await res.json();
    const list = document.getElementById("historyList");
    if (meetings.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px;">저장된 회의록이 없습니다.</div>';
      return;
    }
    list.innerHTML = meetings.map((m) => {
      const date = formatMeetingId(m.id);
      const modeLabel = m.mode === "personal" ? "개인" : "회사";
      const modeClass = m.mode === "personal" ? "personal" : "";
      return `<div class="history-item" onclick="openMeeting('${m.id}')">
        <div class="history-item-left">
          <span class="history-item-date">${date}</span>
          ${m.topic ? `<span class="history-item-topic">${escapeHtml(m.topic)}</span>` : ""}
        </div>
        <div class="history-item-badges">
          <span class="history-item-mode ${modeClass}">${modeLabel}</span>
          <span class="${m.hasTranscript ? 'has' : ''}">트랜스크립트</span>
          <span class="${m.hasSummary ? 'has' : ''}">요약</span>
        </div>
      </div>`;
    }).join("");
  } catch (err) { showError(err.message); }
}

async function openMeeting(id) {
  try {
    const res = await fetch(`/api/meetings/${id}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    currentMeetingId = id;

    const tPanel = document.getElementById("transcriptPanel");

    // 과거 회의록은 탭 없이 최선의 텍스트 표시
    document.getElementById("sourceTabs").style.display = "none";

    if (data.transcript) {
      const lines = data.transcript.split("\n").filter(l => l.trim());
      tPanel.innerHTML = lines.map(l => `<div class="transcript-line">${escapeHtml(l)}</div>`).join("");
      lineCount = lines.length;

      const sourceLabel = data.transcriptSource === "merged" ? "병합" : data.transcriptSource === "precise" ? "정밀" : "실시간";
      document.getElementById("lineCount").textContent = `${lines.length}줄 (${sourceLabel})`;
    } else {
      tPanel.innerHTML = '<div class="empty"><div>트랜스크립트가 없습니다</div></div>';
      lineCount = 0;
    }

    if (data.summary) { showSummary(data.summary); }
    else {
      document.getElementById("summaryPanel").innerHTML = '<div class="empty"><div>요약이 아직 생성되지 않았습니다</div></div>';
      document.getElementById("summaryActions").style.display = "none";
    }

    let statusLabel = formatMeetingId(id);
    if (data.meta && data.meta.topic) statusLabel += ` — ${data.meta.topic}`;
    document.getElementById("summaryStatus").textContent = statusLabel;

    document.getElementById("btnSummarize").disabled = !data.transcript;
  } catch (err) { showError(err.message); }
}

function formatKST(isoString) {
  try { return new Date(isoString).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Seoul" }); }
  catch { return ""; }
}
function formatMeetingId(id) { return id.replace(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/, "$1년 $2월 $3일 $4:$5"); }
function updateLineCount() {
  const tabLabel = currentTab === "merged" ? "병합" : currentTab === "precise" ? "정밀" : "실시간";
  const count = currentTab === "merged" ? mergedData.length : currentTab === "precise" ? preciseData.length : realtimeData.length;
  document.getElementById("lineCount").textContent = `${count}줄 (${tabLabel})`;
}
function updateTimer() {
  const totalMs = pausedElapsed + (Date.now() - startTime);
  const elapsed = Math.floor(totalMs / 1000);
  document.getElementById("timer").textContent =
    `${String(Math.floor(elapsed / 60)).padStart(2, "0")}:${String(elapsed % 60).padStart(2, "0")}`;
}
function showError(msg) { const b = document.getElementById("errorBanner"); b.textContent = msg; b.classList.add("visible"); }
function hideError() { document.getElementById("errorBanner").classList.remove("visible"); }
function escapeHtml(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }

fetch("/api/status").then(r => r.json()).then(data => {
  if (!data.whisperExists || !data.modelExists) showError(`whisper.cpp 경로를 확인하세요. 현재: ${data.whisperDir}`);
  else document.getElementById("statusDot").className = "status-dot ready";

  if (!data.whisperStreamExists) {
    console.warn("whisper-stream 바이너리 없음 — 실시간 STT는 비활성화됩니다");
  }
});
</script>
