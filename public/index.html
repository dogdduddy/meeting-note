<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Minutes AI</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0e0f11;
  --surface: #161719;
  --surface2: #1e2023;
  --border: #2a2d31;
  --text: #e4e4e7;
  --text2: #8b8d94;
  --accent: #ef4444;
  --accent-glow: rgba(239, 68, 68, 0.15);
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.15);
  --blue: #3b82f6;
  --radius: 12px;
}

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ─── Layout ─── */
.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 24px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
}

header h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

header h1 span { color: var(--text2); font-weight: 400; }

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text2);
  display: inline-block;
  margin-right: 8px;
  transition: all 0.3s;
}
.status-dot.recording {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 1.5s ease-in-out infinite;
}
.status-dot.ready {
  background: var(--green);
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ─── Control Bar ─── */
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-record {
  background: var(--accent);
  color: white;
}
.btn-record:hover { background: #dc2626; }
.btn-record:disabled { background: var(--surface2); color: var(--text2); cursor: not-allowed; }

.btn-stop {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-stop:hover { background: var(--border); }
.btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-summarize {
  background: var(--blue);
  color: white;
}
.btn-summarize:hover { background: #2563eb; }
.btn-summarize:disabled { background: var(--surface2); color: var(--text2); cursor: not-allowed; }

.btn-icon {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

/* ─── Panels ─── */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 700px) {
  .panels { grid-template-columns: 1fr; }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-header .count {
  font-weight: 400;
  font-size: 12px;
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 10px;
}

.panel-body {
  padding: 16px 18px;
  flex: 1;
  min-height: 300px;
  max-height: 500px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.8;
}

.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ─── Transcript Lines ─── */
.transcript-line {
  padding: 4px 0;
  animation: fadeIn 0.3s ease;
  border-bottom: 1px solid var(--border);
}
.transcript-line:last-child { border-bottom: none; }
.transcript-time {
  font-size: 11px;
  color: var(--text2);
  margin-right: 8px;
  font-variant-numeric: tabular-nums;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Summary ─── */
.summary-content {
  white-space: pre-wrap;
  word-break: break-word;
}
.summary-content h1, .summary-content h2, .summary-content h3 {
  margin-top: 16px;
  margin-bottom: 8px;
  font-weight: 600;
}
.summary-content h1 { font-size: 18px; }
.summary-content h2 { font-size: 16px; }
.summary-content h3 { font-size: 14px; color: var(--text2); }
.summary-content ul, .summary-content ol {
  padding-left: 20px;
  margin: 8px 0;
}
.summary-content li { margin: 4px 0; }

/* ─── Empty State ─── */
.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 200px;
  color: var(--text2);
  font-size: 14px;
  text-align: center;
}
.empty-icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.4;
}

/* ─── Timer ─── */
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  color: var(--text2);
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 80px;
  text-align: center;
}
.timer.active { color: var(--accent); }

/* ─── Loading ─── */
.loading {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.loading-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
  animation: loadPulse 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.15s; }
.loading-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes loadPulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

/* ─── Error Banner ─── */
.error-banner {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #fca5a5;
  display: none;
}
.error-banner.visible { display: block; }

/* ─── History ─── */
.history-toggle {
  margin-top: 32px;
  text-align: center;
}
.history-toggle button {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
  font-size: 13px;
  margin: 0 auto;
}
.history-toggle button:hover { color: var(--text); border-color: var(--text2); }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>
      <span class="status-dot" id="statusDot"></span>
      Meeting Minutes <span>AI</span>
    </h1>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="controls">
    <button class="btn-record" id="btnRecord" onclick="startRecording()">
      <span class="btn-icon" style="background:white"></span>
      녹음 시작
    </button>
    <button class="btn-stop" id="btnStop" onclick="stopRecording()" disabled>
      녹음 종료
    </button>
    <button class="btn-summarize" id="btnSummarize" onclick="summarize()" disabled>
      요약 생성
    </button>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        실시간 트랜스크립트
        <span class="count" id="lineCount">0줄</span>
      </div>
      <div class="panel-body" id="transcriptPanel">
        <div class="empty">
          <div>
            <div class="empty-icon">🎙️</div>
            녹음을 시작하면 여기에<br>실시간 자막이 표시됩니다
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        회의 요약
        <span class="count" id="summaryStatus">대기</span>
      </div>
      <div class="panel-body" id="summaryPanel">
        <div class="empty">
          <div>
            <div class="empty-icon">📋</div>
            녹음 종료 후 요약 생성 버튼을<br>누르면 AI가 정리합니다
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="history-toggle">
    <button onclick="loadHistory()">과거 회의록 보기</button>
  </div>
</div>

<script>
// ─── State ───
let ws = null;
let timerInterval = null;
let startTime = null;
let lineCount = 0;

// ─── WebSocket ───
function connectWS() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    switch (data.type) {
      case "transcript":
        appendTranscript(data.line);
        break;
      case "summary":
        showSummary(data.content);
        break;
      case "status":
        if (data.summarizing !== undefined) {
          document.getElementById("summaryStatus").textContent =
            data.summarizing ? "생성 중..." : "완료";
          if (data.summarizing) {
            document.getElementById("summaryPanel").innerHTML =
              '<div class="empty"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><br>Gemini가 요약을 생성하고 있습니다...</div>';
          }
        }
        break;
      case "log":
        console.log("[whisper]", data.message);
        break;
    }
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
}
connectWS();

// ─── Recording ───
async function startRecording() {
  hideError();
  try {
    const res = await fetch("/api/start", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    document.getElementById("btnRecord").disabled = true;
    document.getElementById("btnStop").disabled = false;
    document.getElementById("btnSummarize").disabled = true;
    document.getElementById("statusDot").className = "status-dot recording";
    document.getElementById("timer").classList.add("active");

    // 트랜스크립트 패널 초기화
    document.getElementById("transcriptPanel").innerHTML = "";
    document.getElementById("summaryPanel").innerHTML =
      '<div class="empty"><div><div class="empty-icon">📋</div>녹음 종료 후 요약 생성 버튼을<br>누르면 AI가 정리합니다</div></div>';
    document.getElementById("summaryStatus").textContent = "대기";
    lineCount = 0;
    updateLineCount();

    // 타이머 시작
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
  } catch (err) {
    showError(err.message);
  }
}

async function stopRecording() {
  try {
    const res = await fetch("/api/stop", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    document.getElementById("btnRecord").disabled = false;
    document.getElementById("btnStop").disabled = true;
    document.getElementById("btnSummarize").disabled = false;
    document.getElementById("statusDot").className = "status-dot ready";
    document.getElementById("timer").classList.remove("active");

    clearInterval(timerInterval);
  } catch (err) {
    showError(err.message);
  }
}

async function summarize() {
  document.getElementById("btnSummarize").disabled = true;
  try {
    const res = await fetch("/api/summarize", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    // summary는 WebSocket으로 옴
  } catch (err) {
    showError(err.message);
    document.getElementById("btnSummarize").disabled = false;
  }
}

// ─── UI Updates ───
function appendTranscript(line) {
  const panel = document.getElementById("transcriptPanel");
  // 첫 줄이면 empty state 제거
  if (panel.querySelector(".empty")) panel.innerHTML = "";

  const div = document.createElement("div");
  div.className = "transcript-line";

  const time = new Date(line.time);
  const timeStr = time.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  div.innerHTML = `<span class="transcript-time">${timeStr}</span>${escapeHtml(line.text)}`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;

  lineCount++;
  updateLineCount();
}

function showSummary(content) {
  const panel = document.getElementById("summaryPanel");
  // 간단한 마크다운 → HTML 변환
  let html = escapeHtml(content)
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm, "<h2>$1</h2>")
    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\*\s+(.+)$/gm, "<li>$1</li>")
    .replace(/^-\s+(.+)$/gm, "<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
    .replace(/\n\n/g, "<br><br>")
    .replace(/\n/g, "<br>");

  panel.innerHTML = `<div class="summary-content">${html}</div>`;
  document.getElementById("summaryStatus").textContent = "완료";
  document.getElementById("btnSummarize").disabled = false;
}

function updateLineCount() {
  document.getElementById("lineCount").textContent = `${lineCount}줄`;
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const sec = String(elapsed % 60).padStart(2, "0");
  document.getElementById("timer").textContent = `${min}:${sec}`;
}

function showError(msg) {
  const banner = document.getElementById("errorBanner");
  banner.textContent = msg;
  banner.classList.add("visible");
}

function hideError() {
  document.getElementById("errorBanner").classList.remove("visible");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ─── History ───
async function loadHistory() {
  try {
    const res = await fetch("/api/meetings");
    const meetings = await res.json();
    if (meetings.length === 0) return alert("저장된 회의록이 없습니다.");

    const panel = document.getElementById("summaryPanel");
    let html = meetings.map((m) => {
      const date = m.id.replace(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/, "$1-$2-$3 $4:$5");
      return `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
        <strong>${date}</strong> ${m.hasSummary ? "✅" : "📝"}
        ${m.hasSummary ? `<div style="margin-top:8px;font-size:13px;color:var(--text2)">${escapeHtml(m.summary).slice(0, 200)}...</div>` : ""}
      </div>`;
    }).join("");

    panel.innerHTML = html;
    document.getElementById("summaryStatus").textContent = `${meetings.length}건`;
  } catch (err) {
    showError(err.message);
  }
}

// ─── Initial Status Check ───
fetch("/api/status").then(r => r.json()).then(data => {
  if (!data.whisperExists || !data.modelExists) {
    showError(`whisper.cpp 경로를 확인하세요. 현재: ${data.whisperDir}`);
  } else {
    document.getElementById("statusDot").className = "status-dot ready";
  }
});
</script>

</body>
</html>
